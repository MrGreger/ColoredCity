<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>ColoredCity</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- установка на домашний экран: без панелей браузера (iPhone — только так, Fullscreen API там нет) -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="TemplateData/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ColoredCity">
    <meta name="theme-color" content="#1e2a3a">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">ColoredCity</div>
      </div>
      <!-- мобилка: вернуться в полный экран / подсказка про домашний экран на iPhone -->
      <div id="mobile-fullscreen-button"></div>
      <div id="ios-install-hint">
        Чтобы играть на весь экран, нажмите «Поделиться» ⬆︎ и выберите «На экран Домой», затем откройте игру с иконки.
        <div id="ios-install-hint-close">Понятно</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "ColoredCity",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      // ---------- полный экран на мобилке ----------
      // Android: Fullscreen API — по первому касанию и по кнопке, плюс поворот в альбомную ориентацию.
      // iPhone: Fullscreen API для страниц нет — кнопка показывает подсказку «На экран Домой»
      // (оттуда игра открывается без панелей браузера благодаря манифесту и apple-mobile-web-app-capable).
      var root = document.documentElement;
      var canFullscreen = !!(root.requestFullscreen || root.webkitRequestFullscreen);
      var isStandalone = window.matchMedia('(display-mode: fullscreen)').matches ||
                         window.matchMedia('(display-mode: standalone)').matches ||
                         window.navigator.standalone === true;

      function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      }

      function enterFullscreen() {
        if (isFullscreen()) return;
        var request = root.requestFullscreen
          ? root.requestFullscreen({ navigationUI: 'hide' })
          : root.webkitRequestFullscreen();
        Promise.resolve(request).then(function() {
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function() {});
        }).catch(function() {});
      }

      function setupMobileFullscreen() {
        var button = document.querySelector("#mobile-fullscreen-button");
        var hint = document.querySelector("#ios-install-hint");
        if (isStandalone) return;   // уже открыта с домашнего экрана — и так на весь экран

        if (canFullscreen) {
          // первое касание игры сразу разворачивает её
          document.addEventListener('touchend', enterFullscreen, { once: true });
          function updateButton() { button.style.display = isFullscreen() ? 'none' : 'block'; }
          document.addEventListener('fullscreenchange', updateButton);
          document.addEventListener('webkitfullscreenchange', updateButton);
          button.onclick = enterFullscreen;
          updateButton();
        } else {
          button.style.display = 'block';
          button.onclick = function() { hint.style.display = 'block'; };
          document.querySelector("#ios-install-hint-close").onclick = function() { hint.style.display = 'none'; };
        }
      }

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        setupMobileFullscreen();


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
